<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="CT Atak - Centro de Treinamento de Lutas">
  <defs>
    <!-- Ouro escovado: as faixas claras e escuras alternadas imitam metal polido. -->
    <linearGradient id="metal" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#fff0bd"/>
      <stop offset="0.16" stop-color="#f7c63c"/>
      <stop offset="0.34" stop-color="#e2a005"/>
      <stop offset="0.50" stop-color="#ffd968"/>
      <stop offset="0.66" stop-color="#e0a006"/>
      <stop offset="0.84" stop-color="#c07f00"/>
      <stop offset="1"    stop-color="#8f5c00"/>
    </linearGradient>

    <linearGradient id="aro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#d99c02"/>
      <stop offset="1"   stop-color="#8a5900"/>
    </linearGradient>

    <!-- Luz vinda de cima e à esquerda, como numa medalha real -->
    <radialGradient id="luz" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>

    <radialGradient id="fundo" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#1b1b1e"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>

    <path id="arcoCima"  d="M 24.15 99.63 A 98 98 0 0 1 215.85 99.63" fill="none"/>
    <path id="arcoBaixo" d="M 16.32 142.04 A 106 106 0 0 0 223.68 142.04" fill="none"/>
  </defs>

  <!-- Corpo do brasão -->
  <circle cx="120" cy="120" r="119" fill="url(#fundo)"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="url(#aro)" stroke-width="2"/>
  <circle cx="120" cy="120" r="113.5" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="url(#aro)" stroke-width="1.4" stroke-opacity="0.85"/>

  <!-- Medalhão de ouro -->
  <circle cx="120" cy="120" r="90" fill="#0a0a0b"/>
  <circle cx="120" cy="120" r="88" fill="url(#metal)"/>
  <circle cx="120" cy="120" r="88" fill="url(#luz)"/>
  <circle cx="120" cy="120" r="84.5" fill="none" stroke="#7a4f00" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#5c3a00" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Dizeres do anel -->
  <text font-family="'Barlow Condensed','Oswald','Arial Narrow',Arial,sans-serif"
        font-size="11" font-weight="600" fill="#f4f2ee">
    <textPath href="#arcoCima" startOffset="50%" text-anchor="middle"
              textLength="256" lengthAdjust="spacing">MUAY THAI • MMA • JIU-JITSU • BOXE • KICKBOXING • KARATÊ</textPath>
  </text>
  <text font-family="'Barlow Condensed','Oswald','Arial Narrow',Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="2.2" fill="#e8b53a">
    <textPath href="#arcoBaixo" startOffset="50%" text-anchor="middle"
              textLength="278" lengthAdjust="spacing">CENTRO DE TREINAMENTO DE LUTAS</textPath>
  </text>


  <!-- Losangos fechando os vãos entre os dois dizeres -->
  <path d="M18 116 L22 120 L18 124 L14 120 Z" fill="#e8b53a"/>
  <path d="M222 116 L226 120 L222 124 L218 120 Z" fill="#e8b53a"/>

  <!-- ATAK: hastes de espessura constante, com o vão do A e o joelho do K desenhados na mão -->
  <g fill="#0c0c0d" fill-rule="evenodd" transform="translate(49.9 95) scale(0.64)">
    <path d="M0,64 L18,0 H32 L50,64 H35.5 L32,50.5 H18 L14.5,64 Z M20.5,38.5 H29.5 L25,17 Z"/>
    <path d="M55,0 H101 V13.5 H85 V64 H71 V13.5 H55 Z"/>
    <path d="M106,64 L124,0 H138 L156,64 H141.5 L138,50.5 H124 L120.5,64 Z M126.5,38.5 H135.5 L131,17 Z"/>
    <path d="M162,0 H176.5 V27 L195.5,0 H213 L191.5,30.5 L214,64 H196.5 L182,41.5 L176.5,48.5 V64 H162 Z"/>
  </g>

  <!-- Placa da equipe -->
  <rect x="55" y="146" width="130" height="24" rx="3" fill="#0c0c0d"/>
  <rect x="56.2" y="147.2" width="127.6" height="21.6" rx="2.2" fill="none" stroke="#e8b53a" stroke-opacity="0.45" stroke-width="0.9"/>
  <text x="120" y="163" text-anchor="middle"
        font-family="'Barlow Condensed','Oswald','Arial Narrow',Arial,sans-serif"
        font-size="17" font-weight="700" letter-spacing="2" fill="#e02020">RIZZO BJJ</text>
  <text x="120" y="186" text-anchor="middle"
        font-family="'Barlow Condensed','Oswald','Arial Narrow',Arial,sans-serif"
        font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#3a2600"
        textLength="104" lengthAdjust="spacing">MARCELO THEODORO</text>
</svg>
