      <stop offset="0.5" stop-color="#d99c02"/>
      <stop offset="1"   stop-color="#8a5900"/>
    </linearGradient>
  </defs>

  <!-- Marca compacta: no tamanho do cabeçalho, texto miúdo em volta vira borrão,
