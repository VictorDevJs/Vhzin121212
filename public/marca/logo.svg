<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 100" role="img" aria-label="CT Atak">
  <defs>
    <linearGradient id="metalH" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#fff0bd"/>
      <stop offset="0.18" stop-color="#f7c63c"/>
      <stop offset="0.38" stop-color="#e2a005"/>
      <stop offset="0.55" stop-color="#ffd968"/>
      <stop offset="0.75" stop-color="#d99502"/>
