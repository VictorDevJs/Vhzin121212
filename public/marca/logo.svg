    <circle cx="46" cy="46" r="44.6" fill="none" stroke="url(#aroH)" stroke-width="2.2"/>
    <circle cx="46" cy="46" r="34" fill="url(#metalH)"/>
    <circle cx="46" cy="46" r="34" fill="none" stroke="#5c3a00" stroke-opacity="0.7" stroke-width="1.2"/>
    <g fill="#0c0c0d" fill-rule="evenodd" transform="translate(19.3 32.6) scale(0.25)">
