# Deploy no Fly.io.
# Antes do primeiro deploy, crie o volume:
#   fly volumes create dados --size 2
app = "atak-pechincha"
primary_region = "gru"          # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  ATRAS_DE_PROXY = "1"
  DB_ARQUIVO = "/dados/academia.db"
  ARQUIVOS_PASTA = "/dados/arquivos"
  BACKUP_PASTA = "/dados/backups"
  DONO_EMAIL = "dono@atak.com"
  DONO_NOME = "Dono da Atak"

# O disco onde a academia vive. Sem ele os dados somem a cada reinício.
[mounts]
  source = "dados"
  destination = "/dados"

[http_service]
  internal_port = 3000
  force_https = true            # o token de sessao nao pode viajar sem TLS
  auto_stop_machines = false    # a academia precisa responder a qualquer hora
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.health]]
      path = "/api/saude"
      interval = "30s"
      timeout = "5s"
